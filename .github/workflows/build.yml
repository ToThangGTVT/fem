name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # CRT tĩnh: chạy được không cần cài VC++ Redistributable
          - name: Windows x64
            os: windows-latest
            artifact: fem2d-windows-x64
            cmake_args: -A x64 -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          - name: Windows ARM64
            os: windows-11-arm
            artifact: fem2d-windows-arm64
            cmake_args: -A ARM64 -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          - name: Linux x64
            os: ubuntu-24.04
            artifact: fem2d-linux-x64
            cmake_args: -G Ninja
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            artifact: fem2d-linux-arm64
            cmake_args: -G Ninja
          - name: macOS ARM64
            os: macos-15
            artifact: fem2d-macos-arm64
            cmake_args: -G Ninja -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          - name: macOS x64
            os: macos-15-intel
            artifact: fem2d-macos-x64
            cmake_args: -G Ninja -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Cài thư viện (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Header cho SDL3 build từ mã nguồn (các backend được nạp động lúc chạy)
          sudo apt-get install -y ninja-build \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev \
            libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libwayland-dev libdecor-0-dev libdbus-1-dev libibus-1.0-dev libudev-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev

      - name: Cài công cụ (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Cấu hình
        # SDL3 luôn build tĩnh từ mã nguồn để file chạy không phụ thuộc thư viện hệ thống
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_DISABLE_FIND_PACKAGE_SDL3=ON
          ${{ matrix.cmake_args }}

      - name: Biên dịch
        run: cmake --build build --config Release --parallel

      - name: Kiểm tra
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Đóng gói
        run: |
          dir="dist/${{ matrix.artifact }}"
          mkdir -p "$dir"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp build/Release/fem2d.exe "$dir/"
          else
            cp build/fem2d "$dir/"
          fi
          cp -r examples README.md "$dir/"
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -NoProfile -Command "Compress-Archive -Path '${{ matrix.artifact }}' -DestinationPath '${{ matrix.artifact }}.zip'"
          else
            tar czf "${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Phát hành
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Tạo GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "FEM2D $GITHUB_REF_NAME" \
            --generate-notes
